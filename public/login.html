<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · 360° Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2307070F%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%23E9F709%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%23E9F709%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070F;color:#fff;font-family:"DM Sans",system-ui,sans-serif;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(233,247,9,.22),transparent 65%);top:-160px;right:-120px;pointer-events:none}
  .box{width:min(400px,92vw);background:#0E0E1A;border:1px solid #1F1F2E;border-radius:16px;padding:32px 30px;position:relative;display:flex;flex-direction:column;gap:12px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#E9F709}
  h1{font-family:Unbounded,sans-serif;font-weight:900;font-size:24px;line-height:1.05;margin:8px 0 10px}
  label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:6px}
  input{width:100%;background:#07070F;border:1px solid #2C2C3E;border-radius:8px;padding:11px 12px;color:#fff;font:inherit;font-size:15px}
  input:focus{outline:2px solid #E9F709;outline-offset:1px;border-color:#E9F709}
  button{width:100%;margin-top:6px;background:#E9F709;color:#07070F;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  button:hover{filter:brightness(.95)}
  .err{display:none;background:rgba(240,101,90,.14);color:#F0655A;border-radius:8px;padding:9px 12px;font-size:13.5px}
  .err.show{display:block}
  .foot{margin-top:6px;font-size:12.5px;color:rgba(255,255,255,.45)}
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div>
      <div class="eyebrow">AI Growth Skool</div>
      <h1>360° Command Center</h1>
    </div>
    <div class="err" id="err">Wrong email or password. Try again.</div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    </div>
    <div>
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Sign in</button>
    <div class="foot">Team dashboard for @kulwantnagi. No account? Ask the owner for an invite link.</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
