<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360° Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2307070F%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%23E9F709%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%23E9F709%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap">
<style>
:root{
  --bg:#F5F8F0; --panel:#FFFFFF; --panel2:#ECEFE6; --line:#D9DDD0; --line2:#C6CBBB;
  --ink:#0A0A14; --ink2:#4A4D52; --ink3:#7C8085;
  --accent:#E9F709; --accent-ink:#4F5600; --accent-soft:rgba(233,247,9,.28); --accent-glow:rgba(233,247,9,.18);
  --on-accent:#07070F; --dark:#07070F; --dark2:#0A0A14;
  --good:#1F8A4C; --good-bg:rgba(31,138,76,.14); --warn:#B6730A; --warn-bg:rgba(182,115,10,.14); --bad:#C0392B; --bad-bg:rgba(192,57,43,.14);
  --shadow:0 8px 28px rgba(10,10,20,.08);
  --r:12px; --rs:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07070F; --panel:#0E0E1A; --panel2:#141422; --line:#1F1F2E; --line2:#2C2C3E;
    --ink:#FFFFFF; --ink2:rgba(255,255,255,.72); --ink3:rgba(255,255,255,.46);
    --accent-ink:#E9F709; --accent-soft:rgba(233,247,9,.16); --accent-glow:rgba(233,247,9,.14);
    --good:#4CCB7F; --good-bg:rgba(76,203,127,.14); --warn:#F0B54A; --warn-bg:rgba(240,181,74,.14); --bad:#F0655A; --bad-bg:rgba(240,101,90,.14);
    --shadow:0 12px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07070F; --panel:#0E0E1A; --panel2:#141422; --line:#1F1F2E; --line2:#2C2C3E;
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.72); --ink3:rgba(255,255,255,.46);
  --accent-ink:#E9F709; --accent-soft:rgba(233,247,9,.16); --accent-glow:rgba(233,247,9,.14);
  --good:#4CCB7F; --good-bg:rgba(76,203,127,.14); --warn:#F0B54A; --warn-bg:rgba(240,181,74,.14); --bad:#F0655A; --bad-bg:rgba(240,101,90,.14);
  --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--accent);color:var(--on-accent)}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--dark);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;border-right:1px solid #1F1F2E}
.brand{padding:4px 10px 18px}
.brand .eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.brand h1{font-family:Unbounded,"DM Sans",sans-serif;font-weight:900;font-size:17px;line-height:1.05;margin-top:6px;color:#fff}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:9px 10px;border-radius:var(--rs);color:rgba(255,255,255,.72);cursor:pointer;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--accent);color:#07070F;font-weight:700}
.nav button .ic{width:22px;height:22px;display:grid;place-items:center;flex:none}
.nav button .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button .badge{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:99px}
.nav button.active .badge{background:rgba(7,7,15,.18)}
.rail-foot{padding:10px;font-size:12px;color:rgba(255,255,255,.45);display:flex;flex-direction:column;gap:8px}
.rail-foot .theme{display:flex;gap:4px}
.rail-foot .theme button{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);padding:5px;border-radius:6px;cursor:pointer;font-size:12px}
.rail-foot .theme button.on{background:rgba(233,247,9,.15);color:var(--accent);border-color:rgba(233,247,9,.4)}

.main{padding:28px 32px 60px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.topbar .eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent-ink)}
.topbar h2{font-family:Unbounded,"DM Sans",sans-serif;font-weight:900;font-size:30px;line-height:1;margin-top:6px;letter-spacing:-.01em}
.topbar .sub{color:var(--ink2);margin-top:8px;max-width:60ch}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{background:var(--panel);border:1px solid var(--line2);padding:8px 14px;border-radius:var(--rs);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(.95)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--rs);padding:9px 11px;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel.dark{background:var(--dark2);color:#fff;border-color:#1F1F2E;position:relative;overflow:hidden}
.panel.dark::before{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(233,247,9,.22),transparent 65%);pointer-events:none}
.panel h3{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px}
.panel.dark h3{color:var(--accent)}
.panel .h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel .h h3{margin:0}
.muted{color:var(--ink3);font-size:13px}
.hint{color:var(--ink2);font-size:13px}
.big{font-family:Unbounded,"DM Sans",sans-serif;font-weight:900;font-size:44px;line-height:1;letter-spacing:-.02em}
.big.sm{font-size:30px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid transparent;letter-spacing:.3px;white-space:nowrap}
.pill.p{background:var(--panel2);color:var(--ink2);border-color:var(--line)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ex{background:transparent;border:1px dashed var(--line2);color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
td .btn.small{padding:3px 8px}

/* checklist */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.check li button.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);background:transparent;cursor:pointer;margin-top:2px;display:grid;place-items:center}
.check li button.box svg{width:13px;height:13px;stroke:var(--on-accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check li.done button.box{background:var(--accent);border-color:var(--accent)}
.check li.done button.box svg{opacity:1}
.check li.done .t{text-decoration:line-through;color:var(--ink3)}
.check li .t{flex:1}
.check li .t small{display:block;color:var(--ink3);font-size:12.5px}
.plat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}
.plat i{width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block}
.prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.panel.dark .prog{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.08)}

/* week scorecard */
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week7 .d{border:1px solid var(--line);border-radius:var(--rs);padding:8px 6px;text-align:center;background:var(--panel2)}
.week7 .d.today{border-color:var(--accent-ink)}
.week7 .d .l{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);font-weight:700}
.week7 .d .v{font-family:Unbounded,sans-serif;font-weight:700;font-size:15px;margin-top:4px}
.week7 .d .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.week7 .d .bar>i{display:block;height:100%;background:var(--accent)}

/* calendar */
.cal{display:grid;grid-template-columns:120px repeat(7,minmax(130px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);min-width:1030px}
.cal .hd{background:var(--panel2);padding:10px 8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--ink3);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal .hd b{display:block;color:var(--ink);font-family:Unbounded,sans-serif;font-size:14px;letter-spacing:0;text-transform:none;margin-top:2px}
.cal .hd.today{color:var(--accent-ink)}
.cal .hd.today b{color:var(--accent-ink)}
.cal .rl{padding:10px 10px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.cal .rl small{font-weight:500;color:var(--ink3);font-size:11.5px}
.cal .cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;min-height:74px;display:flex;flex-direction:column;gap:4px;position:relative}
.cal .cell.today{background:var(--accent-glow)}
.cal .cell .ghost{font-size:11.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:6px;padding:3px 6px;cursor:pointer}
.cal .cell .ghost:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
.cal .cell .chip{font-size:12px;border-radius:6px;padding:4px 7px;background:var(--panel2);border-left:3px solid var(--line2);cursor:pointer;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.cal .cell .chip.planned{border-left-color:var(--ink3)}
.cal .cell .chip.drafted{border-left-color:var(--warn)}
.cal .cell .chip.scheduled{border-left-color:var(--accent-ink)}
.cal .cell .chip.posted{border-left-color:var(--good);opacity:.7;text-decoration:line-through}
.cal .cell .add{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);color:var(--ink3);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;opacity:0}
.cal .cell:hover .add{opacity:1}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col .ch{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--ink3);padding:4px 4px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card .ti{font-weight:600;line-height:1.3}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .acts{display:flex;gap:4px;justify-content:flex-end;margin-top:2px}
.card .acts button{background:transparent;border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-size:12px;cursor:pointer;color:var(--ink2)}
.card .acts button:hover{border-color:var(--ink3);color:var(--ink)}

/* x slots */
.slot{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.slot.posted{border-color:var(--good);background:var(--good-bg)}
.slot .sh{display:flex;justify-content:space-between;align-items:center}
.slot .sh b{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-ink)}
.slot textarea{min-height:88px}
.slot .cnt{font-size:12px;color:var(--ink3)}
.slot .cnt.over{color:var(--bad);font-weight:700}
.counter{display:flex;align-items:center;gap:12px}
.counter button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:18px}

/* stages */
.stages{display:flex;gap:4px;align-items:center}
.stages span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stages span.on{background:var(--accent)}

/* sparkline */
.spark{width:100%;height:84px;display:block}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .area{fill:var(--accent);fill-opacity:.14}
.spark .line{stroke:var(--accent-ink);stroke-width:2;fill:none}
.spark .pt{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.spark .hit{fill:transparent}
.spark .vline{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.metric-card{display:flex;flex-direction:column;gap:6px;position:relative}
.metric-card .top{display:flex;justify-content:space-between;align-items:baseline}
.metric-card .top .v{font-family:Unbounded,sans-serif;font-weight:700;font-size:22px}
.metric-card .delta{font-size:12.5px;font-weight:600}
.metric-card .delta.up{color:var(--good)}
.metric-card .delta.dn{color:var(--bad)}
.tip{position:absolute;background:var(--dark2);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;transform:translate(-50%,-110%);white-space:nowrap;display:none;z-index:5;border:1px solid #2C2C3E}

/* playbook */
.pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pb .panel dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:14px}
.pb .panel dt{color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding-top:2px}
.pb .panel dd{margin:0}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .node{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;min-width:150px;flex:1}
.flow .node b{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
.flow .node.src{background:var(--dark2);color:#fff;border-color:#2C2C3E}
.flow .node.src b{color:var(--accent)}
.flow .arrow{display:grid;place-items:center;padding:0 8px;color:rgba(255,255,255,.55);font-size:18px}
.phase{border-left:3px solid var(--accent);padding-left:14px}
.phase b{font-family:Unbounded,sans-serif;font-size:13px}
ul.tight{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
ul.tight li{margin:3px 0}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(7,7,15,.6);display:none;place-items:center;z-index:50;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:var(--shadow)}
.modal h3{font-family:Unbounded,sans-serif;font-size:17px;font-weight:700;margin-bottom:14px}
.modal .fields{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.modal .fields .w{grid-column:1/-1}
.modal .foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:500}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink)}
.checks input{accent-color:var(--accent-ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark2);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;border:1px solid #2C2C3E;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.empty{border:1px dashed var(--line2);border-radius:var(--rs);padding:16px;text-align:center;color:var(--ink3);font-size:13.5px}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .brand{padding:0 8px;flex-basis:100%}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;flex-basis:100%}
  .nav button{white-space:nowrap;width:auto}
  .nav button .badge{margin-left:4px}
  .rail-foot{display:none}
  .main{padding:18px 14px 50px}
  .g2,.g3,.g4,.g6{grid-template-columns:1fr 1fr}
  .span2{grid-column:span 2}
  .modal .fields{grid-template-columns:1fr}
}
@media (max-width:600px){ .g2,.g3,.g4,.g6{grid-template-columns:1fr} .span2{grid-column:auto} .topbar h2{font-size:24px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
body.readonly [data-act]:not([data-act="gotab"]):not([data-act="calnav"]):not([data-act="export"]):not([data-act="download"]){pointer-events:none;opacity:.55}
body.readonly .cal .cell .add{display:none}
.who{color:rgba(255,255,255,.75);font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
.who span{color:var(--accent);font-weight:700;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase}
.linkbox{display:flex;gap:6px;align-items:center;margin-top:8px}
.linkbox input{font-size:12.5px}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.busy i{background:var(--warn)}
.sync.off i{background:var(--bad)}

<script>
/* ============ constants ============ */
const PLATFORMS = {
  li:{name:'LinkedIn', short:'LI'},
  ig:{name:'Instagram', short:'IG'},
  fb:{name:'Facebook', short:'FB'},
  x:{name:'X', short:'X'},
  th:{name:'Threads', short:'TH'},
  nl:{name:'Newsletter', short:'NL'}
};
const PLAT_ORDER = ['li','ig','fb','x','th','nl'];
const POST_TYPES = ['Reel','Carousel','Text post','Image post','Story','Thread','Tweet','Video','Newsletter'];
const POST_STATUS = ['planned','drafted','scheduled','posted'];
const IDEA_STAGES = ['idea','drafting','ready','posted'];
const REEL_STAGES = ['hook','script','shoot','edit','posted'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* Cadence: what a marketer would run for this exact mix.
   day: 0=Sun..6=Sat. nlWeek tasks only show on newsletter weeks. */
const DAILY_TASKS = [
  {id:'x-tweets', p:'x', t:'Post 3 tweets on X', s:'Morning news · midday insight · evening question'},
  {id:'x-replies', p:'x', t:'Reply to 10 accounts on X', s:'Bigger accounts in AI + your students. Add value, not "great post"'},
  {id:'th-post', p:'th', t:'Post 1 Thread', s:'Take today\'s best tweet, expand it to 3–5 lines'},
  {id:'ig-story', p:'ig', t:'Instagram story', s:'Behind the scenes, a poll, or repost today\'s reel'},
  {id:'engage', p:'all', t:'15 min engagement block', s:'Answer comments + DMs on every platform'}
];
const WEEKLY_TASKS = {
  1:[{id:'reel', p:'ig', t:'Publish Reel #1 (Instagram + Facebook)', s:'Tutorial style: one AI graphics trick'},
     {id:'li-post', p:'li', t:'LinkedIn text post', s:'Lesson or opinion, 150–250 words, hook in line 1'}],
  2:[{id:'ig-carousel', p:'ig', t:'Instagram carousel', s:'5–7 slides, save-worthy tip list'},
     {id:'x-chat', p:'x', t:'Join an X chat / Space', s:'See X tab for the chat list'}],
  3:[{id:'reel', p:'ig', t:'Publish Reel #2 (Instagram + Facebook)', s:'Before/after or myth-busting'},
     {id:'li-post', p:'li', t:'LinkedIn text post', s:'Story from a student or your own work'},
     {id:'nl-draft', p:'nl', t:'Draft the newsletter', s:'Collect this fortnight\'s AI news, pick tool + tutorial', nl:true}],
  4:[{id:'li-carousel', p:'li', t:'LinkedIn carousel (PDF)', s:'Repurpose Tuesday\'s IG carousel'},
     {id:'x-chat', p:'x', t:'Join an X chat / Space', s:'See X tab for the chat list'},
     {id:'nl-send', p:'nl', t:'Send the newsletter', s:'Then promote it: tweet + story + LinkedIn comment', nl:true}],
  5:[{id:'reel', p:'ig', t:'Publish Reel #3 (Instagram + Facebook)', s:'Fast hands-on demo, under 30s'},
     {id:'li-post', p:'li', t:'LinkedIn text post', s:'Friday: a win, a number, or a lesson'},
     {id:'metrics', p:'all', t:'Log this week\'s numbers', s:'Growth tab → add a row for this week'}],
  6:[{id:'reel', p:'ig', t:'Publish Reel #4 (Instagram + Facebook)', s:'Weekend: personal / storytelling'},
     {id:'batch-shoot', p:'ig', t:'Batch-shoot next week\'s 4 reels', s:'One setup, one outfit, four scripts'}],
  0:[{id:'plan', p:'all', t:'Plan next week in the Calendar', s:'Every cell should have something'},
     {id:'batch-tweets', p:'x', t:'Batch-write 21 tweets', s:'Store them in the Tweet bank on the X tab'}]
};
const PILLARS = ['AI News & Updates','AI Graphics Tutorials','Prompting Tips','Brand Visuals','AI Video','Behind the Scenes','Student Wins'];

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = parse(typeof d==='string'?d:iso(d)); x.setDate(x.getDate()+n); return iso(x); };
const today = () => iso(new Date());
const weekStart = s => { const d = parse(s); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return iso(d); };
const fmt = s => { if(!s) return ''; const d = parse(s); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
const fmtLong = s => parse(s).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const nlWeek = (dateStr, anchor) => { const diff = daysBetween(weekStart(anchor), weekStart(dateStr)); return ((diff/7)%2+2)%2 === 0; };
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));

/* ============ seed ============ */
function seed(){
  const t = today();
  const ws = weekStart(t);
  // anchor newsletter to the next Thursday from today
  let anchor = t; while(parse(anchor).getDay() !== 4) anchor = addDays(anchor,1);
  const ex = true;
  const ideas = [
    {id:uid(), title:'Nano Banana 2 vs ChatGPT Image 2.0: which one for brand graphics?', pillar:'AI Graphics Tutorials', stage:'ready', platforms:['ig','li','x','nl'], notes:'Same prompt, both tools, side-by-side. Show where each wins.', ex},
    {id:uid(), title:'The 3-line brand prompt formula (style + colors + mood)', pillar:'Prompting Tips', stage:'drafting', platforms:['ig','x','th'], notes:'Teach it like a recipe. Hindi/Hinglish VO for the reel.', ex},
    {id:uid(), title:'Why your AI graphics look "off-brand" (and the fix)', pillar:'Brand Visuals', stage:'idea', platforms:['li','ig'], notes:'Common mistake: no reference image, no hex codes in the prompt.', ex},
    {id:uid(), title:'This week in AI: 5 updates a social media manager should know', pillar:'AI News & Updates', stage:'idea', platforms:['nl','x','th'], notes:'Pulls from the daily research log.', ex},
    {id:uid(), title:'Student win: how Priya made 30 ad creatives in one afternoon', pillar:'Student Wins', stage:'idea', platforms:['li','ig','fb'], notes:'Get permission + screenshots first.', ex}
  ];
  const posts = [
    {id:uid(), date:ws, platform:'ig', type:'Reel', title:'Nano Banana 2 vs ChatGPT Image 2.0', status:'posted', ideaId:ideas[0].id, ex},
    {id:uid(), date:ws, platform:'fb', type:'Reel', title:'Nano Banana 2 vs ChatGPT Image 2.0 (cross-post)', status:'posted', ideaId:ideas[0].id, ex},
    {id:uid(), date:ws, platform:'li', type:'Text post', title:'I tested both image tools with the same brand prompt…', status:'posted', ideaId:ideas[0].id, ex},
    {id:uid(), date:addDays(ws,1), platform:'ig', type:'Carousel', title:'3-line brand prompt formula', status:'drafted', ideaId:ideas[1].id, ex},
    {id:uid(), date:addDays(ws,2), platform:'ig', type:'Reel', title:'Fix your off-brand AI graphics in 20 sec', status:'planned', ideaId:ideas[2].id, ex},
    {id:uid(), date:addDays(ws,2), platform:'li', type:'Text post', title:'Your AI graphics look off-brand. Here\'s the one-line fix.', status:'planned', ideaId:ideas[2].id, ex},
    {id:uid(), date:addDays(ws,3), platform:'li', type:'Carousel', title:'3-line brand prompt formula (PDF)', status:'planned', ideaId:ideas[1].id, ex},
    {id:uid(), date:addDays(ws,4), platform:'ig', type:'Reel', title:'Speed-run: 5 ad creatives in 5 minutes', status:'planned', ex},
  ];
  const reels = [
    {id:uid(), title:'Nano Banana 2 vs ChatGPT Image 2.0', hook:'Same prompt. Two tools. One clear winner for brand graphics.', script:'Show prompt → generate in both → zoom on brand colors → verdict → CTA: newsletter link in bio', stage:'posted', postDate:ws, platforms:['ig','fb'], ex},
    {id:uid(), title:'Fix your off-brand AI graphics in 20 sec', hook:'Your AI graphics look cheap because of ONE missing line.', script:'Before shot → add hex codes + reference → after shot → "save this"', stage:'edit', postDate:addDays(ws,2), platforms:['ig','fb'], ex},
    {id:uid(), title:'Speed-run: 5 ad creatives in 5 minutes', hook:'5 ad creatives. 5 minutes. No designer.', script:'Timer on screen, rapid cuts, final grid reveal', stage:'script', postDate:addDays(ws,4), platforms:['ig','fb'], ex},
    {id:uid(), title:'Why I moved my whole workflow to AI graphics', hook:'I fired my old design process. Here\'s what replaced it.', script:'Personal, talking head, 3 reasons', stage:'hook', postDate:addDays(ws,5), platforms:['ig','fb'], ex},
  ];
  const newsletters = [
    {id:uid(), issue:1, sendDate:anchor, subject:'AI Updates #1: the image tool war just got interesting', status:'drafting',
     news:'1. Nano Banana 2 update\n2. ChatGPT Image 2.0 brand mode\n3. Meta AI ads change\n4. New Reels editing feature\n5. LinkedIn video push',
     tool:'Nano Banana 2 — best for consistent brand colors', tutorial:'The 3-line brand prompt formula (with screenshots)', cta:'Reply with your brand colors, I\'ll send a prompt back', subs:'', open:'', ex}
  ];
  const xChats = [
    {id:uid(), name:'Example: weekly AI creators chat', day:'Tue', time:'9:00 PM IST', tag:'#AIChat', notes:'Replace with a real chat you found. Search X for "AI chat" + your niche.', ex},
    {id:uid(), name:'Example: marketing Twitter Space', day:'Thu', time:'8:30 PM IST', tag:'Space', notes:'Ask one sharp question, then follow the host.', ex}
  ];
  const tweets = [
    {id:uid(), text:'Most "AI graphics look fake" problems are prompt problems. Add your brand hex codes. Add a reference image. Done.', status:'bank', ex},
    {id:uid(), text:'Tested Nano Banana 2 and ChatGPT Image 2.0 with the same brand prompt today. Full breakdown in Thursday\'s newsletter.', status:'bank', ex},
    {id:uid(), text:'Social media managers: which takes you longer — writing the caption or making the graphic? Honest answers.', status:'bank', ex}
  ];
  // 4 example weeks of numbers so the growth charts show what they do
  const metrics = [];
  const base = {ig:4120, fb:2210, li:1830, x:640, th:210, nl:95};
  for(let i=4;i>=1;i--){
    const w = addDays(ws, -7*i);
    const row = {id:uid(), week:w, ex:true};
    for(const k in base){ row[k] = Math.round(base[k] * (1 - 0.035*i)); }
    metrics.push(row);
  }
  return {
    v:1, settings:{ startDate:t, nlAnchor:anchor, goalDays:90,
      goals:{ig:10000, fb:5000, li:5000, x:2500, th:1000, nl:1000},
      notes:{} },
    ideas, posts, reels, newsletters, xChats, tweets, metrics,
    done:{}, xslots:{}, replies:{}, tab:'today', calWeek: ws
  };
}

/* ============ state ============ */
const KEY = 'kn360_cache';
let S = null, BASE = null, saveTimer = null, dirty = false, offline = false, ME = null;
const isViewer = () => ME && ME.role === 'viewer';
async function jfetch(url, opts={}){
  const r = await fetch(url, { credentials:'same-origin', ...opts, headers:{ 'Content-Type':'application/json', 'Accept':'application/json', ...(opts.headers||{}) } });
  if(r.status === 401){ location.href = '/login'; throw new Error('signed out'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
function setSync(text, cls){ const el = $('#sync'); if(!el) return; el.className = 'sync ' + (cls||''); el.querySelector('span').textContent = text; }
async function api(method, body){
  const r = await fetch('/api/state', { method, credentials:'same-origin', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  if(r.status === 401){ location.href = '/login'; throw new Error('signed out'); }
  return r;
}
async function boot(){
  try{
    ME = await jfetch('/api/me');
    $('#who').innerHTML = `${esc(ME.name)}<span>${esc(ME.role)}</span>`;
    document.body.classList.toggle('readonly', isViewer());
    const j = await (await api('GET')).json();
    if(j.state && j.state.settings){ S = j.state; BASE = j.updatedAt; setSync('Saved',''); }
    else { S = seed(); BASE = null; }
    offline = false;
  }catch(e){
    try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(_){ S = null; }
    if(!S || !S.settings) S = seed();
    offline = true; setSync('Offline · changes stay on this device','off');
  }
  S.calWeek = S.calWeek || weekStart(today());
  render();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(isViewer()){ setSync('View only',''); return; }
  dirty = true; setSync('Saving…','busy');
  clearTimeout(saveTimer); saveTimer = setTimeout(push, 600);
}
async function push(){
  try{
    const r = await api('PUT', { state:S, base:BASE });
    const j = await r.json();
    if(r.status === 409){ S = j.state; BASE = j.updatedAt; dirty = false; toast(j.updatedBy ? `Updated: ${j.updatedBy} saved a newer version` : 'Updated from another device'); render(); return; }
    if(!r.ok) throw new Error(j.error || 'save failed');
    BASE = j.updatedAt; dirty = false; offline = false; setSync('Saved','');
  }catch(e){
    if(e.message === 'signed out') return;
    offline = true; setSync('Offline · will retry','off');
    clearTimeout(saveTimer); saveTimer = setTimeout(push, 5000);
  }
}
window.addEventListener('pagehide', () => {
  if(!dirty || offline) return;
  try{ navigator.sendBeacon('/api/state', new Blob([JSON.stringify({ state:S, base:BASE })], { type:'application/json' })); }catch(e){}
});
window.addEventListener('online', () => { if(dirty) push(); });
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

/* ============ tasks for a day ============ */
function tasksFor(dateStr){
  const dow = parse(dateStr).getDay();
  const isNl = nlWeek(dateStr, S.settings.nlAnchor);
  const list = [];
  const hasIssue = S.newsletters.some(n=>n.sendDate===dateStr && n.status!=='sent');
  for(const t of (WEEKLY_TASKS[dow]||[])){ if(t.nl && !isNl) continue; if(t.id==='nl-send' && hasIssue) continue; list.push({...t, key:'w-'+t.id}); }
  for(const t of DAILY_TASKS) list.push({...t, key:'d-'+t.id});
  // scheduled items for that date
  for(const p of S.posts.filter(p=>p.date===dateStr && p.status!=='posted'))
    list.push({key:'post-'+p.id, p:p.platform, t:`Publish: ${p.title}`, s:`${p.type} · ${PLATFORMS[p.platform].name} · ${p.status}`, ref:'post', id:p.id});
  for(const n of S.newsletters.filter(n=>n.sendDate===dateStr && n.status!=='sent'))
    list.push({key:'nl-'+n.id, p:'nl', t:`Send newsletter issue #${n.issue}`, s:n.subject||'No subject yet', ref:'nl', id:n.id});
  return list;
}
function dayScore(dateStr){
  const list = tasksFor(dateStr); if(!list.length) return {done:0,total:0,pct:0};
  const d = S.done[dateStr]||{}; const done = list.filter(t=>d[t.key]).length;
  return {done, total:list.length, pct:Math.round(done/list.length*100)};
}
function streak(){
  let n=0, d=today();
  // today counts if complete; otherwise start from yesterday
  if(dayScore(d).pct < 80) d = addDays(d,-1);
  while(dayScore(d).total && dayScore(d).pct >= 80){ n++; d = addDays(d,-1); if(n>365) break; }
  return n;
}

/* ============ nav ============ */
const TABS = [
  ['today','Today','M12 8v4l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z'],
  ['calendar','Calendar','M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
  ['pipeline','Idea Pipeline','M4 6h16M4 12h10M4 18h6'],
  ['newsletter','Newsletter','M4 4h16v16H4zM4 7l8 6 8-6'],
  ['x','X & Threads','M4 4l16 16M20 4L4 20'],
  ['reels','Reels','M4 5h16v14H4zM4 9h16M4 15h16M9 5v14M15 5v14'],
  ['growth','Growth','M3 17l6-6 4 4 8-8M14 7h7v7'],
  ['playbook','Playbook','M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v15'],
  ['team','Team','M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75'],
  ['settings','Settings','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z']
];
function renderNav(){
  const sc = dayScore(today());
  const badges = { today: sc.total ? `${sc.done}/${sc.total}` : '', pipeline: String(S.ideas.filter(i=>i.stage!=='posted').length), reels: String(S.reels.filter(r=>r.stage!=='posted').length) };
  $('#nav').innerHTML = TABS.filter(([k]) => k !== 'team' || (ME && ME.role === 'owner')).map(([k,l,p]) => `<button class="${S.tab===k?'active':''}" data-tab="${k}"><span class="ic"><svg viewBox="0 0 24 24"><path d="${p}"/></svg></span>${l}${badges[k]?`<span class="badge">${badges[k]}</span>`:''}</button>`).join('');
}

/* ============ render ============ */
function render(){
  renderNav();
  const r = { today:rToday, calendar:rCalendar, pipeline:rPipeline, newsletter:rNewsletter, x:rX, reels:rReels, growth:rGrowth, playbook:rPlaybook, team:rTeam, settings:rSettings }[S.tab] || rToday;
  $('#main').innerHTML = r();
  if(S.tab==='growth') wireSparks();
  if(S.tab==='team') loadTeam();
  if(S.tab==='settings' && ME) $('#acctName').textContent = `${ME.name} · ${ME.email}`;
  save();
}
function head(eyebrow, title, sub, actions=''){
  return `<div class="topbar"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="actions">${actions}</div></div>`;
}
const exPill = ex => ex ? `<span class="pill ex">example</span>` : '';
const platPill = p => `<span class="plat"><i></i>${PLATFORMS[p]?PLATFORMS[p].short:'ALL'}</span>`;
const statusPill = s => ({planned:'p',drafted:'warn',scheduled:'acc',posted:'good',idea:'p',drafting:'warn',ready:'acc',sent:'good'}[s]||'p');

/* ---- TODAY ---- */
function rToday(){
  const t = today(); const list = tasksFor(t); const d = S.done[t]||{}; const sc = dayScore(t);
  const ws = weekStart(t);
  const isNl = nlWeek(t, S.settings.nlAnchor);
  const nextNl = S.newsletters.filter(n=>n.status!=='sent' && n.sendDate>=t).sort((a,b)=>a.sendDate.localeCompare(b.sendDate))[0];
  const upcoming = S.posts.filter(p=>p.status!=='posted' && p.date>t).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const reelsInFlight = S.reels.filter(r=>r.stage!=='posted');
  const weekPosts = S.posts.filter(p=>p.date>=ws && p.date<=addDays(ws,6));
  const weekPosted = weekPosts.filter(p=>p.status==='posted').length;
  const dayStart = S.settings.startDate; const dayN = daysBetween(dayStart, t)+1;
  const byPlat = PLAT_ORDER.map(p=>{ const arr=list.filter(x=>x.p===p); return arr.length?`${PLATFORMS[p].short} ${arr.filter(x=>d[x.key]).length}/${arr.length}`:null; }).filter(Boolean).join(' · ');
  return head('Command center', fmtLong(t), `Day ${dayN} of your ${S.settings.goalDays}-day push. ${isNl?'<b>Newsletter week.</b>':'Off-week for the newsletter.'} ${byPlat}`,
      `<button class="btn" data-act="gotab" data-v="calendar">Open this week</button><button class="btn primary" data-act="addpost" data-date="${t}">+ Add post</button>`) +
  `<div class="grid g4" style="margin-bottom:16px">
    <div class="panel dark"><h3>Today</h3><div class="big num">${sc.pct}<span style="font-size:22px">%</span></div><div class="muted" style="color:rgba(255,255,255,.6);margin-top:6px">${sc.done} of ${sc.total} tasks done</div><div class="prog" style="margin-top:10px"><i style="width:${sc.pct}%"></i></div></div>
    <div class="panel"><h3>Streak</h3><div class="big num">${streak()}</div><div class="muted" style="margin-top:6px">days at 80%+ complete</div></div>
    <div class="panel"><h3>This week</h3><div class="big num">${weekPosted}<span style="font-size:20px;color:var(--ink3)">/${weekPosts.length}</span></div><div class="muted" style="margin-top:6px">posts published vs planned</div></div>
    <div class="panel"><h3>Next newsletter</h3><div class="big sm">${nextNl?fmt(nextNl.sendDate):'—'}</div><div class="muted" style="margin-top:6px">${nextNl?`Issue #${nextNl.issue} · ${nextNl.status} · ${daysBetween(t,nextNl.sendDate)} days left`:'Add an issue on the Newsletter tab'}</div></div>
  </div>
  <div class="grid g3">

function spark(vals, labels){
  const W=300,H=84,pl=6,pr=10,pt=10,pb=8; const n=vals.length;
  if(n<2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="var(--ink3)">Log two weeks to see a trend</text></svg>`;
  const mn=Math.min(...vals), mx=Math.max(...vals); const rng=(mx-mn)||1;
  const X=i=>pl+i*(W-pl-pr)/(n-1); const Y=v=>pt+(H-pt-pb)*(1-(v-mn)/rng);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[n-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
  const grid=[0.5].map(f=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${(pt+(H-pt-pb)*f).toFixed(1)}" y2="${(pt+(H-pt-pb)*f).toFixed(1)}"/>`).join('');
  const seg=(W-pl-pr)/(n-1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<path class="area" d="${area}"/><path class="line" d="${path}"/><line class="vline" y1="${pt}" y2="${H-pb}" x1="0" x2="0"/><circle class="pt" r="4" cx="${pts[n-1][0]}" cy="${pts[n-1][1]}"/>${pts.map((p,i)=>`<rect class="hit" x="${(p[0]-seg/2).toFixed(1)}" y="0" width="${seg.toFixed(1)}" height="${H}" data-v="${vals[i]}" data-l="${labels[i]}" data-x="${p[0].toFixed(1)}"/>`).join('')}</svg>`;
}
function wireSparks(){
  document.querySelectorAll('.metric-card').forEach(card=>{
    const tip=card.querySelector('.tip'); const svg=card.querySelector('svg'); const vl=svg.querySelector('.vline');
    svg.querySelectorAll('.hit').forEach(h=>{
      h.addEventListener('mouseenter',e=>{ const r=svg.getBoundingClientRect(); const cr=card.getBoundingClientRect(); const x=Number(h.dataset.x)/300*r.width; tip.style.display='block'; tip.style.left=(r.left-cr.left+x)+'px'; tip.style.top=(r.top-cr.top)+'px'; tip.textContent=`${fmt(h.dataset.l)}: ${Number(h.dataset.v).toLocaleString('en-IN')}`; vl.setAttribute('x1',h.dataset.x); vl.setAttribute('x2',h.dataset.x); vl.style.opacity=1; });
      h.addEventListener('mouseleave',()=>{ tip.style.display='none'; vl.style.opacity=0; });
    });
  });
}

function openModal(title, fieldsHtml, onSave, onDelete){
  $('#modal').innerHTML = `<h3>${title}</h3><form id="mform"><div class="fields">${fieldsHtml}</div><div class="foot"><div>${onDelete?'<button type="button" class="btn danger" id="mdel">Delete</button>':''}</div><div class="row"><button type="button" class="btn" id="mcancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>`;

  const f = $('#mform');
  f.onsubmit = e => { e.preventDefault(); const data = {}; new FormData(f).forEach((v,k)=>{ if(data[k]!==undefined){ data[k]=[].concat(data[k],v);} else data[k]=v; }); f.querySelectorAll('input[type=checkbox]').forEach(cb=>{ if(!data[cb.name]) data[cb.name]=[]; else data[cb.name]=[].concat(data[cb.name]); }); onSave(data); closeModal(); render(); };

  const isNew=!m.id; const last=[...S.metrics].sort((a,b)=>a.week.localeCompare(b.week)).pop();
  openModal(isNew?'Log this week':'Edit week', fld('Week of (Monday)','week','date',m.week||weekStart(today()),'',true)+PLAT_ORDER.map(p=>fld(PLATFORMS[p].name+(p==='nl'?' subscribers':' followers'),p,'number',m[p]??(last?last[p]:'') )).join(''),
    d=>{ const obj={...m,id:m.id||uid(),week:weekStart(d.week),ex:false}; PLAT_ORDER.forEach(p=>obj[p]=Number(d[p])||0); const ex=S.metrics.find(x=>x.week===obj.week && x.id!==obj.id); if(ex){ Object.assign(ex,obj,{id:ex.id}); } else if(isNew) S.metrics.push(obj); else Object.assign(S.metrics.find(x=>x.id===m.id),obj); toast('Numbers saved'); }, isNew?null:()=>{ S.metrics=S.metrics.filter(x=>x.id!==m.id); });
}

/* ============ events ============ */
document.addEventListener('click', e => {
  const nb = e.target.closest('[data-tab]'); if(nb){ S.tab = nb.dataset.tab; render(); return; }
  const th = e.target.closest('[data-theme]'); if(th){ setTheme(th.dataset.theme); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, t = today();
  const find = (arr)=>arr.find(x=>x.id===id);
  switch(a){
    case 'gotab': S.tab = el.dataset.v; render(); break;
    case 'toggle': { S.done[t] = S.done[t]||{}; S.done[t][el.dataset.key] = !S.done[t][el.dataset.key]; render(); break; }
    case 'addpost': e.preventDefault(); postForm({date:el.dataset.date||t, platform:el.dataset.plat||'ig', type:el.dataset.type && POST_TYPES.includes(el.dataset.type)?el.dataset.type:undefined}); break;
    case 'editpost': e.preventDefault(); postForm(find(S.posts)); break;
    case 'calnav': S.calWeek = el.dataset.v==='0' ? weekStart(t) : addDays(S.calWeek, Number(el.dataset.v)); render(); break;
    case 'addidea': ideaForm({}); break;
    case 'editidea': ideaForm(find(S.ideas)); break;
    case 'idea-move': { const i=find(S.ideas); const k=clamp(IDEA_STAGES.indexOf(i.stage)+Number(el.dataset.v),0,3); i.stage=IDEA_STAGES[k]; render(); break; }
    case 'repurpose': repurposeForm(find(S.ideas)); break;
    case 'addnl': nlForm({sendDate: el.dataset.date}); break;
    case 'editnl': nlForm(find(S.newsletters)); break;
    case 'addchat': chatForm({}); break;
    case 'editchat': chatForm(find(S.xChats)); break;
    case 'addtweet': tweetForm({}); break;
    case 'edittweet': tweetForm(find(S.tweets)); break;
    case 'tweet-used': find(S.tweets).status='used'; render(); break;
    case 'slot-post': { const s=(S.xslots[t]=S.xslots[t]||[{text:'',posted:false},{text:'',posted:false},{text:'',posted:false}]); const i=Number(el.dataset.i); s[i].posted=!s[i].posted; if(s.every(x=>x.posted)){ S.done[t]=S.done[t]||{}; S.done[t]['d-x-tweets']=true; toast('All 3 tweets done. Checklist updated.'); } render(); break; }
    case 'slot-pull': { const s=(S.xslots[t]=S.xslots[t]||[{text:'',posted:false},{text:'',posted:false},{text:'',posted:false}]); const b=S.tweets.find(x=>x.status==='bank'); if(b){ s[Number(el.dataset.i)].text=b.text; b.status='used'; render(); } break; }
    case 'rep': { S.replies[t]=clamp((S.replies[t]||0)+Number(el.dataset.v),0,99); if(S.replies[t]>=10){ S.done[t]=S.done[t]||{}; S.done[t]['d-x-replies']=true; } render(); break; }
    case 'addreel': reelForm({}); break;
    case 'editreel': reelForm(find(S.reels)); break;
    case 'reel-next': { const r=find(S.reels); r.stage=REEL_STAGES[Math.min(4,REEL_STAGES.indexOf(r.stage)+1)]; if(r.stage==='posted'){ for(const p of (r.platforms||[])){ const post=S.posts.find(x=>x.title===r.title && x.platform===p); if(post) post.status='posted'; } } render(); break; }
    case 'addmetric': metricForm({}); break;
    case 'editmetric': metricForm(find(S.metrics)); break;
    case 'export': navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copied')).catch(()=>toast('Copy blocked. Use Download.')); break;
    case 'download': { const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const u=URL.createObjectURL(b); const l=document.createElement('a'); l.href=u; l.download=`kn360-backup-${t}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); break; }
    case 'import': { try{ const j=JSON.parse($('#importBox').value); if(!j.settings||!j.posts) throw 0; S=j; S.tab='today'; render(); toast('Restored'); }catch(x){ toast('That is not a valid backup'); } break; }
    case 'clearex': { for(const k of ['ideas','posts','reels','newsletters','xChats','tweets','metrics']) S[k]=S[k].filter(x=>!x.ex); render(); toast('Example items removed'); break; }
    case 'copy': navigator.clipboard.writeText(el.dataset.link).then(()=>toast('Link copied')).catch(()=>toast('Select the link and copy it')); break;
    case 'inv-del': jfetch('/api/team/invites/' + id, { method:'DELETE' }).then(()=>{ toast('Invite cancelled'); loadTeam(); }).catch(err=>toast(err.message)); break;
    case 'user-del': if(confirm(`Remove ${el.dataset.name} from the team?`)) jfetch('/api/team/users/' + id, { method:'DELETE' }).then(()=>{ toast('Removed'); loadTeam(); }).catch(err=>toast(err.message)); break;
    case 'reset': if(confirm('Reset everything to the starting example? This cannot be undone.')){ S=seed(); render(); } break;
  }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, t=today();
  if(a==='slot'){ const s=(S.xslots[t]=S.xslots[t]||[{text:'',posted:false},{text:'',posted:false},{text:'',posted:false}]); s[Number(el.dataset.i)].text=el.value; const c=el.parentElement.querySelector('.cnt'); c.textContent=el.value.length+'/280'; c.classList.toggle('over',el.value.length>280); save(); }
  if(a==='note'){ S.settings.notes=S.settings.notes||{}; S.settings.notes[el.dataset.k]=el.value; save(); }
  if(a==='goal'){ S.settings.goals[el.dataset.k]=Number(el.value)||0; save(); }
  if(a==='setting'){ const k=el.dataset.k; S.settings[k]= k==='goalDays'?(Number(el.value)||90):el.value; save(); }
});
document.addEventListener('change', e => { const el=e.target.closest('[data-act="setting"]'); if(el) renderNav(); });

/* ============ theme ============ */
function setTheme(v){ try{ localStorage.setItem('kn360_theme', v); }catch(e){} applyTheme(); }
function applyTheme(){ let v='system'; try{ v=localStorage.getItem('kn360_theme')||'system'; }catch(e){} if(v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); document.querySelectorAll('.rail-foot [data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===v)); }

applyTheme();
boot();
</script>
